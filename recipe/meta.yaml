{% set version = "0.11.0" %}

package:
  name: pylbm
  version: {{ version }}

source:
  git_url: https://github.com/pylbm/pylbm.git
  git_rev: v{{ version }}

build:
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps -vv"
  noarch: python

requirements:
  host:
    - python {{ python_min }}.*
    - pip
    - hatch
    - setuptools
    - wheel
  run:
    - python >={{ python_min }}
    - numpy >=2
    - numpy-stl
    - matplotlib-base
    - sympy >=1.13
    - cython
    - h5py
    - mpi4py
    - colorlog
    - colorama
    - cerberus
    - jinja2

test:
  requires:
    - python {{ python_min }}
    - mpich  # [not win]
  imports:
    - pylbm

about:
  home: http://pylbm.readthedocs.io
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: A flexible Python package for lattice Boltzmann method

extra:
  recipe-maintainers:
    - gouarin
